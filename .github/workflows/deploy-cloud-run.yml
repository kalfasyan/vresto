name: deploy-cloud-run

# Publishes the public demo (deploy/public) to Google Cloud Run.
# Setup, once (see docs/advanced/public-hosting.md):
#   - variables GCP_PROJECT (project id) and, optionally, GCP_REGION (default europe-west1)
#   - secret GCP_SA_KEY = JSON key of a service account that can deploy to Cloud Run
# Until GCP_PROJECT is set, this workflow is skipped.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloud-run
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Pin the image to this commit
        run: sed -i "s/^ARG VRESTO_REF=.*/ARG VRESTO_REF=${GITHUB_SHA}/" deploy/public/Dockerfile
      # One instance only: each visitor's page state lives in that instance's memory.
      # Session affinity keeps a visitor on it; the long timeout keeps their WebSocket open.
      - name: Build and deploy
        run: |
          gcloud run deploy vresto \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "$REGION" \
            --source deploy/public \
            --port 7860 \
            --cpu 1 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 80 \
            --session-affinity \
            --timeout 3600 \
            --allow-unauthenticated \
            --quiet
