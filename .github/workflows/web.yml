name: web

# Browser smoke test for Vresto Lite (web/), at phone size in headless Chromium.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Playwright
        # The runner image already has Chrome's system libraries, so when apt mirrors are unreachable
        # the browser alone is enough.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Run smoke test
        run: node smoke.mjs
