name: web

# Browser smoke test for Vresto Lite (web/), at phone size in headless Chromium.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Playwright
        # The runner image already has Chrome's system libraries, so when apt mirrors are unreachable
        # the browser alone is enough.
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Run smoke test
        run: node smoke.mjs
