name: web

# Browser smoke test for Vresto Lite (web/), at phone size in headless Chromium.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        # The runner image already has Chrome's system libraries, so when apt mirrors are unreachable
        # the browser alone is enough.
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Run smoke test
        run: node smoke.mjs
